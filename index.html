<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freedom Dashboard · Ministry Report</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F8FA; --card:#FFFFFF; --line:#EAECEF; --line2:#F0F2F5;
    --ink:#0F172A; --ink2:#475569; --muted:#94A3B8;
    --brand:#4F46E5; --brand-soft:#EEF2FF;
    --green:#10B981; --green-soft:#ECFDF5;
    --amber:#F59E0B; --amber-soft:#FFFBEB;
    --rose:#F43F5E; --rose-soft:#FFF1F2;
    --sky:#0EA5E9; --sky-soft:#F0F9FF;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;padding:28px 20px 60px}
  .wrap{max-width:1200px;margin:0 auto}
  h1,h2,h3,.num{font-family:'Plus Jakarta Sans',sans-serif}

  header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
  .brand{display:flex;align-items:center;gap:13px}
  .logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--brand),#7C3AED);display:grid;place-items:center;color:#fff;font-family:'Plus Jakarta Sans';font-weight:800;font-size:20px;box-shadow:0 4px 12px rgba(79,70,229,.3)}
  .brand h1{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .brand p{color:var(--muted);font-size:12.5px;margin-top:3px}
  .actions{display:flex;gap:10px;align-items:center}
  button{font-family:'Plus Jakarta Sans';font-weight:600;font-size:13.5px;cursor:pointer;border:none;border-radius:9px;padding:10px 17px;transition:.15s}
  .btn-primary{background:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.25)}
  .btn-primary:hover{background:#4338CA}
  .btn-ghost{background:var(--card);color:var(--ink2);border:1px solid var(--line)}
  .btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn-add{background:var(--brand-soft);color:var(--brand);border:1px dashed #C7D2FE;width:100%;padding:11px;margin-top:8px}
  .btn-add:hover{background:#E0E7FF;border-color:var(--brand)}

  .period-banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(135deg,#EEF2FF,#F0F9FF);border:1px solid #E0E7FF;border-radius:14px;padding:16px 20px;margin-bottom:26px}
  .period-banner .cal{width:42px;height:42px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:'Plus Jakarta Sans';font-weight:800;flex-shrink:0}
  .period-banner .cal .mo{font-size:9px;text-transform:uppercase;letter-spacing:.05em;line-height:1;opacity:.85;text-align:center}
  .period-banner .cal .dy{font-size:17px;line-height:1;margin-top:1px;text-align:center}
  .period-banner .pi{flex:1;min-width:0}
  .period-banner .pi b{font-family:'Plus Jakarta Sans';font-weight:800;font-size:15px;display:block}
  .period-banner .pi span{color:var(--ink2);font-size:12.5px}
  .period-banner .wk{font-family:'Plus Jakarta Sans';font-weight:800;font-size:12px;color:var(--brand);background:#fff;border:1px solid #E0E7FF;padding:8px 14px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}

  .sec-head{display:flex;align-items:center;gap:10px;margin:34px 0 16px}
  .sec-head .bar{width:4px;height:19px;border-radius:3px}
  .sec-head h2{font-size:15px;font-weight:800;letter-spacing:-.01em}
  .sec-head .tag{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

  .kgrid{display:grid;gap:14px}
  .k4{grid-template-columns:repeat(4,1fr)}
  .k3{grid-template-columns:repeat(3,1fr)}
  .k5{grid-template-columns:repeat(5,1fr)}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px 18px;box-shadow:var(--shadow)}
  .kpi .lbl{font-size:11.5px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;line-height:1.3;min-height:28px}
  .kpi .v{font-family:'Plus Jakarta Sans';font-weight:800;font-size:30px;letter-spacing:-.03em;margin-top:8px;line-height:1}
  .kpi .v small{font-size:16px;font-weight:700}
  .kpi .meta{font-size:12px;color:var(--muted);margin-top:5px}
  .accent-brand .v{color:var(--brand)} .accent-green .v{color:var(--green)}
  .accent-amber .v{color:var(--amber)} .accent-rose .v{color:var(--rose)}
  .accent-sky .v{color:var(--sky)} .accent-ink .v{color:var(--ink)}

  .dgrid{display:grid;gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
  .card h3{font-size:13.5px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .card h3 .pill{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px}
  .stat-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2)}
  .stat-row:last-child{border-bottom:none}
  .stat-row .n{color:var(--ink2);font-size:13.5px}
  .stat-row .d{font-family:'Plus Jakarta Sans';font-weight:700;font-size:15px}

  .lvl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
  .lvl .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .lvl .top b{font-family:'Plus Jakarta Sans';font-weight:700;font-size:14px}
  .lvl .top .pct{font-family:'Plus Jakarta Sans';font-weight:800;font-size:20px}
  .lvl .track{height:8px;background:var(--line2);border-radius:6px;overflow:hidden;margin-bottom:12px}
  .lvl .fill{height:100%;border-radius:6px;transition:width .5s}
  .lvl .nums{display:flex;gap:16px;flex-wrap:wrap}
  .lvl .nums span{font-size:12px;color:var(--muted)}
  .lvl .nums span b{color:var(--ink);font-weight:600}

  .intern-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--shadow);overflow-x:auto}
  table.it{width:100%;border-collapse:collapse;min-width:520px}
  table.it th{background:var(--brand-soft);color:var(--brand);font-family:'Plus Jakarta Sans';font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;text-align:left}
  table.it th:first-child{border-radius:9px 0 0 9px}
  table.it th:last-child{border-radius:0 9px 9px 0}
  table.it td{padding:10px 12px;border-bottom:1px solid var(--line2);font-size:13.5px;color:var(--ink2)}
  table.it td:first-child{font-weight:600;color:var(--ink)}
  table.it tr:last-child td{border-bottom:none}
  table.it .tot td{background:var(--bg);font-family:'Plus Jakarta Sans';font-weight:700;color:var(--ink)}

  /* Edit modal */
  .overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(3px);z-index:50;align-items:center;justify-content:center;padding:20px}
  .overlay.open{display:flex}
  .modal{background:var(--card);border-radius:18px;padding:26px;max-width:920px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal > h2{font-size:17px;font-weight:800;margin-bottom:4px}
  .modal > .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
  .edit-sec{margin-bottom:26px}
  .edit-sec .eh{font-family:'Plus Jakarta Sans';font-weight:700;font-size:13px;color:var(--brand);text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line2)}
  .fg{display:grid;gap:12px}
  .fg2{grid-template-columns:repeat(2,1fr)} .fg3{grid-template-columns:repeat(3,1fr)}
  .fg4{grid-template-columns:repeat(4,1fr)} .fg5{grid-template-columns:repeat(5,1fr)} .fg6{grid-template-columns:repeat(6,1fr)}
  label{display:block;font-size:11px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px}
  input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink);font-family:'Inter';font-size:13.5px}
  input:focus{outline:none;border-color:var(--brand);background:#fff}
  .row-edit{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;position:relative}
  .row-edit .rm{position:absolute;top:10px;right:10px;background:var(--rose-soft);color:var(--rose);border:none;width:26px;height:26px;border-radius:7px;cursor:pointer;font-size:15px;line-height:1;padding:0}
  .row-edit .rm:hover{background:var(--rose);color:#fff}
  .save-bar{position:sticky;bottom:-26px;background:var(--card);padding:16px 0 0;margin-top:6px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line2)}

  /* PIN modal */
  .pin-modal{background:var(--card);border-radius:18px;padding:30px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .pin-modal .lk{width:52px;height:52px;border-radius:14px;background:var(--brand-soft);display:grid;place-items:center;margin:0 auto 16px;font-size:24px}
  .pin-modal h3{font-size:17px;font-weight:800;margin-bottom:6px}
  .pin-modal p{color:var(--muted);font-size:13px;margin-bottom:20px}
  .pin-input{text-align:center;font-size:24px;letter-spacing:12px;font-family:'Plus Jakarta Sans';font-weight:700;padding:12px}
  .pin-err{color:var(--rose);font-size:12.5px;font-weight:600;margin-top:10px;min-height:18px}
  .pin-btns{display:flex;gap:10px;margin-top:18px}
  .pin-btns button{flex:1}


  .sync-badge{font-family:'Plus Jakarta Sans';font-weight:700;font-size:11px;padding:7px 12px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em;display:inline-flex;align-items:center;gap:6px}
  .sync-badge::before{content:"";width:7px;height:7px;border-radius:50%}
  .sync-live{background:var(--green-soft);color:#047857}
  .sync-live::before{background:var(--green);box-shadow:0 0 0 0 rgba(16,185,129,.5);animation:pulse 2s infinite}
  .sync-loading{background:var(--amber-soft);color:#B45309}
  .sync-loading::before{background:var(--amber)}
  .sync-error{background:var(--rose-soft);color:#BE123C}
  .sync-error::before{background:var(--rose)}
  .sync-saving{background:var(--brand-soft);color:var(--brand)}
  .sync-saving::before{background:var(--brand);animation:pulse 1s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}70%{box-shadow:0 0 0 6px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}

  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:36px}

  @media(max-width:1000px){
    .k4,.k5{grid-template-columns:repeat(3,1fr)}
    .fg4,.fg5,.fg6{grid-template-columns:repeat(3,1fr)}
  }
  @media(max-width:640px){
    body{padding:20px 14px 50px}
    .k3,.k4,.k5,.dgrid{grid-template-columns:repeat(2,1fr)}
    .fg2,.fg3,.fg4,.fg5,.fg6{grid-template-columns:1fr}
    .modal{padding:20px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">F</div>
      <div>
        <h1>Freedom Dashboard</h1>
        <p>Ministry Report</p>
      </div>
    </div>
    <div class="actions">
      <span id="syncBadge" class="sync-badge sync-loading">Connecting&hellip;</span>
      <button class="btn-ghost" id="editBtn">Edit data</button>
    </div>
  </header>

  <div id="periodBanner"></div>
  <div id="view"></div>

  <p class="foot">Editable report &middot; Data is saved locally on this device</p>
</div>

<!-- PIN overlay -->
<div class="overlay" id="pinOverlay">
  <div class="pin-modal">
    <div class="lk">&#128274;</div>
    <h3>Enter PIN to edit</h3>
    <p>Only editors can change the numbers.</p>
    <input type="password" inputmode="numeric" maxlength="4" class="pin-input" id="pinInput" placeholder="&bull;&bull;&bull;&bull;">
    <div class="pin-err" id="pinErr"></div>
    <div class="pin-btns">
      <button class="btn-ghost" id="pinCancel">Cancel</button>
      <button class="btn-primary" id="pinOk">Unlock</button>
    </div>
  </div>
</div>

<!-- Edit overlay -->
<div class="overlay" id="editOverlay">
  <div class="modal">
    <h2>Edit report</h2>
    <p class="sub">Update numbers, add or remove rows, then Save. Everything is stored in your browser.</p>
    <div id="editBody"></div>
    <div class="save-bar">
      <button class="btn-ghost" id="closeBtn">Cancel</button>
      <button class="btn-primary" id="saveBtn">Save changes</button>
    </div>
  </div>
</div>

<script>
const KEY='freedom_dashboard_v2';
const PIN='1234'; // <-- change this to your own 4-digit PIN

// ===== Supabase connection =====
const SUPABASE_URL='https://yjhessebmbiorkkbdeag.supabase.co';
const SUPABASE_KEY='sb_publishable_XXpOP3nmDe_Qxsg5yE0wyw_YZkWt1aG';
const TABLE='reporte_ministerio';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function setSync(state,text){
  const b=document.getElementById('syncBadge');
  b.className='sync-badge sync-'+state;
  b.innerHTML=text;
}


const seed = {
  familyGroups:{ live:1, youth:1, groups:37, avg:7 },
  ffgJuly:{ ftv:65, sal:64, signed:35, attended:17, hv:28, hvpct:44 },
  churchJuly:{ ftv:19, sal:13, signed:2, attended:1, hv:5, hvpct:18 },
  fcyJuly:{ ftv:17, sal:12, signed:7, attended:6, hv:2, hvpct:20 },
  tithe:{ leaders:36, noGiving:2, noIncome:2, students:2 },
  leadership:{ present:1, absent:1, dz:1 },
  apprentices:[ {label:'Cohort 1', value:4}, {label:'Cohort 2', value:4}, {label:'Cohort 3', value:6} ],
  path:[
    {name:'LOF 1', value:73},{name:'LOF 2', value:29},{name:'LOF 3', value:3},{name:'LOF 4', value:2},
    {name:'FBC Tri 1', value:9},{name:'FBC Tri 2', value:5},{name:'FBC Tri 3', value:3},{name:'FBC Tri 4', value:2},{name:'FBC Tri 5', value:5}
  ],
  familyClass:{ students:1, newApp:1, newBap:1, recruitApp:1 },
  levels:[
    {name:'LOF Level 1', enrolled:72, active:70, attended:30, absent:40, dz:2},
    {name:'LOF Level 2', enrolled:32, active:20, attended:11, absent:9, dz:1},
    {name:'LOF Level 3', enrolled:0, active:2, attended:0, absent:2, dz:0},
    {name:'LOF Level 4', enrolled:2, active:2, attended:0, absent:2, dz:0},
    {name:'Freedom Bible College Tri 1', enrolled:12, active:6, attended:4, absent:2, dz:0},
  ],
  interns:{
    month:'August',
    people:[
      {name:'Chris Luna', w:[ {r:1,a:0,f:''},{r:0,a:0,f:''},{r:0,a:0,f:''},{r:0,a:0,f:''} ], tot:1},
      {name:'Hebret Solorzano', w:[ {r:0,a:0,f:''},{r:0,a:0,f:''},{r:0,a:0,f:''},{r:0,a:0,f:''} ], tot:0},
      {name:'Jorge Silva', w:[ {r:0,a:0,f:''},{r:0,a:0,f:''},{r:0,a:0,f:''},{r:0,a:0,f:''} ], tot:0},
      {name:'Yony Bautista', w:[ {r:0,a:0,f:''},{r:0,a:0,f:''},{r:0,a:0,f:''},{r:0,a:0,f:''} ], tot:0},
    ]
  }
};

let data = cacheLoad();  // instant paint from local cache, then Supabase refresh
let saving=false;

function cacheLoad(){ try{const s=localStorage.getItem(KEY);if(s)return migrate(JSON.parse(s));}catch(e){} return structuredClone(seed); }
function migrate(d){ // fill any missing keys from seed so old saves still work
  const base=structuredClone(seed);
  return Object.assign({}, base, d, {
    familyGroups:Object.assign({},base.familyGroups,d.familyGroups),
    tithe:Object.assign({},base.tithe,d.tithe),
    leadership:Object.assign({},base.leadership,d.leadership),
    familyClass:Object.assign({},base.familyClass,d.familyClass),
  });
}
function cacheSave(){ try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){} }
async function persist(){
  cacheSave();
  saving=true; setSync('saving','Saving&hellip;');
  try{
    const { error } = await sb.from(TABLE).update({ data:data, updated_at:new Date().toISOString() }).eq('id',1);
    if(error) throw error;
    setSync('live','Live');
  }catch(e){
    console.error('Save error',e);
    setSync('error','Save failed');
  }finally{ saving=false; }
}
async function pullFromCloud(){
  try{
    const { data:rows, error } = await sb.from(TABLE).select('data').eq('id',1).single();
    if(error) throw error;
    if(rows && rows.data && Object.keys(rows.data).length){
      data = migrate(rows.data);
      cacheSave();
      render();
    }
    setSync('live','Live');
  }catch(e){
    console.error('Load error',e);
    setSync('error','Offline');
  }
}
function startRealtime(){
  sb.channel('report-changes')
    .on('postgres_changes',{ event:'UPDATE', schema:'public', table:TABLE, filter:'id=eq.1' },
      function(payload){
        if(saving) return; // ignore the echo of our own save
        if(payload.new && payload.new.data){
          data = migrate(payload.new.data);
          cacheSave();
          render();
          setSync('live','Live');
        }
      })
    .subscribe();
}

const MONTHS_EN=['January','February','March','April','May','June','July','August','September','October','November','December'];
function currentPeriod(){
  const now=new Date();
  const day=now.getDate();
  const week=Math.min(Math.ceil(day/7),5);
  return { month:MONTHS_EN[now.getMonth()], monthShort:MONTHS_EN[now.getMonth()].slice(0,3), day:day, week:week, year:now.getFullYear() };
}
function renderBanner(){
  const p=currentPeriod();
  document.getElementById('periodBanner').innerHTML=
    '<div class="cal"><div><div class="mo">'+p.monthShort+'</div><div class="dy">'+p.day+'</div></div></div>'+
    '<div class="pi"><b>'+p.month+' '+p.year+'</b><span>Reporting period &middot; auto-updates every week</span></div>'+
    '<div class="wk">Week '+p.week+'</div>';
}

const kpi=(cls,lbl,val,unit,meta)=>'<div class="kpi accent-'+cls+'"><div class="lbl">'+lbl+'</div><div class="v">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+(meta?'<div class="meta">'+meta+'</div>':'')+'</div>';
const secHead=(color,title,tag)=>'<div class="sec-head"><span class="bar" style="background:'+color+'"></span><h2>'+title+'</h2>'+(tag?'<span class="tag">'+tag+'</span>':'')+'</div>';
const statRow=(n,d)=>'<div class="stat-row"><span class="n">'+n+'</span><span class="d">'+d+'</span></div>';

function render(){
  const d=data; let h='';

  const totalLofActive = d.levels.reduce((a,l)=>a+(+l.active||0),0);
  const totalLofEnrolled = d.levels.reduce((a,l)=>a+(+l.enrolled||0),0);
  const apprLast = d.apprentices.length ? d.apprentices[d.apprentices.length-1] : {label:'-',value:0};
  h+=secHead('var(--brand)','Overview','Quick view');
  h+='<div class="kgrid k4">'+
    kpi('brand','Active students (LOF)',totalLofActive,'','of '+totalLofEnrolled+' enrolled')+
    kpi('green','Family groups',d.familyGroups.groups,'','avg '+d.familyGroups.avg+' per group')+
    kpi('sky','Leaders (Tithe)',d.tithe.leaders,'',d.tithe.noGiving+' no record')+
    kpi('amber','Apprentices ('+apprLast.label+')',apprLast.value,'',d.apprentices.length+' cohorts')+
  '</div>';

  h+=secHead('var(--sky)','Follow Up','Tracking');
  h+='<div class="dgrid k3">'+
    '<div class="card"><h3><span class="pill" style="background:var(--sky-soft);color:var(--sky)">FFG</span>Family Groups</h3>'+
      statRow('FTV',d.ffgJuly.ftv)+statRow('SAL',d.ffgJuly.sal)+statRow('Signed up for FFC',d.ffgJuly.signed)+statRow('Attended FFC',d.ffgJuly.attended)+statRow('HV complete',d.ffgJuly.hv)+statRow('HV %',d.ffgJuly.hvpct+'%')+
    '</div>'+
    '<div class="card"><h3><span class="pill" style="background:var(--brand-soft);color:var(--brand)">Church</span>Church</h3>'+
      statRow('FTV',d.churchJuly.ftv)+statRow('SAL',d.churchJuly.sal)+statRow('Signed up for FFC',d.churchJuly.signed)+statRow('Attended FFC',d.churchJuly.attended)+statRow('HV complete',d.churchJuly.hv)+statRow('HV %',d.churchJuly.hvpct+'%')+
    '</div>'+
    '<div class="card"><h3><span class="pill" style="background:var(--rose-soft);color:var(--rose)">FCY</span>Youth</h3>'+
      statRow('FTV',d.fcyJuly.ftv)+statRow('SAL',d.fcyJuly.sal)+statRow('Signed up for FFC',d.fcyJuly.signed)+statRow('Attended FFC',d.fcyJuly.attended)+statRow('HV complete',d.fcyJuly.hv)+statRow('HV %',d.fcyJuly.hvpct+'%')+
    '</div>'+
  '</div>';

  h+=secHead('var(--green)','Leadership & Giving','');
  let apprRows=''; d.apprentices.forEach(a=>{ apprRows+=statRow(a.label,a.value); });
  h+='<div class="dgrid k4">'+
    '<div class="card"><h3>Tithe & Offering</h3>'+
      statRow('Total leaders',d.tithe.leaders)+statRow('No giving record',d.tithe.noGiving)+statRow('No income',d.tithe.noIncome)+statRow('Students',d.tithe.students)+
    '</div>'+
    '<div class="card"><h3>Leadership Attendance</h3>'+
      statRow('In attendance',d.leadership.present)+statRow('Absent',d.leadership.absent)+statRow('DZ',d.leadership.dz)+
    '</div>'+
    '<div class="card"><h3>Apprentices</h3>'+apprRows+
    '</div>'+
    '<div class="card"><h3>Family Class</h3>'+
      statRow('Total students',d.familyClass.students)+statRow('New application',d.familyClass.newApp)+statRow('New baptism',d.familyClass.newBap)+statRow('LOF recruitment',d.familyClass.recruitApp)+
    '</div>'+
  '</div>';

  h+=secHead('var(--amber)','Schools &middot; Path Report','Enrolled');
  const pathTotal=d.path.reduce((a,p)=>a+(+p.value||0),0);
  h+='<div class="kgrid k5">';
  d.path.forEach((p,i)=>{ h+=kpi(i<4?'amber':'ink',p.name,p.value); });
  h+=kpi('brand','Total Path',pathTotal);
  h+='</div>';

  h+=secHead('var(--rose)','Lifestyle of Freedom Levels','Attendance');
  const colors=['var(--brand)','var(--sky)','var(--green)','var(--amber)','var(--rose)'];
  h+='<div class="dgrid k3">';
  d.levels.forEach((l,i)=>{
    const denom=(+l.attended||0)+(+l.absent||0);
    const attPct=denom?Math.round((l.attended/denom)*100):0;
    h+='<div class="lvl">'+
      '<div class="top"><b>'+l.name+'</b><span class="pct" style="color:'+colors[i%5]+'">'+attPct+'%</span></div>'+
      '<div class="track"><div class="fill" style="width:'+attPct+'%;background:'+colors[i%5]+'"></div></div>'+
      '<div class="nums">'+
        '<span>Enrolled <b>'+l.enrolled+'</b></span>'+
        '<span>Active <b>'+l.active+'</b></span>'+
        '<span>Attended <b>'+l.attended+'</b></span>'+
        '<span>Absent <b>'+l.absent+'</b></span>'+
        '<span>DZ <b>'+l.dz+'</b></span>'+
      '</div>'+
    '</div>';
  });
  h+='</div>';

  h+=secHead('var(--brand)','Intern Numbers &middot; '+d.interns.month,'Weekly');
  h+='<div class="dgrid" style="grid-template-columns:repeat(2,1fr)">';
  d.interns.people.forEach(p=>{
    h+='<div class="intern-wrap"><table class="it">'+
      '<thead><tr><th>'+p.name+'</th><th>Recruits / Baptism</th><th>LOF Apps</th><th>FFG Attend.</th></tr></thead>'+
      '<tbody>';
    p.w.forEach((w,i)=>{ h+='<tr><td>Week '+(i+1)+'</td><td>'+(w.r||0)+'</td><td>'+(w.a||0)+'</td><td>'+(w.f||'—')+'</td></tr>'; });
    h+='<tr class="tot"><td>Total</td><td>'+p.tot+'</td><td>—</td><td>—</td></tr>'+
      '</tbody></table></div>';
  });
  h+='</div>';

  document.getElementById('view').innerHTML=h;
}

// ---------- EDITOR ----------
function inp(path,label,type){
  type=type||'number';
  const val=path.split('.').reduce((o,k)=>o[k],data);
  return '<div><label>'+label+'</label><input type="'+type+'" data-path="'+path+'" value="'+val+'"></div>';
}
function buildEditor(){
  const d=data; let h='';

  h+='<div class="edit-sec"><div class="eh">Family Groups Numbers</div><div class="fg fg4">'+
    inp('familyGroups.live','Live')+inp('familyGroups.youth','Youth')+inp('familyGroups.groups','# Groups')+inp('familyGroups.avg','Average')+
  '</div></div>';

  const fu=(k,t)=>'<div class="edit-sec"><div class="eh">'+t+'</div><div class="fg fg6">'+
    inp(k+'.ftv','FTV')+inp(k+'.sal','SAL')+inp(k+'.signed','Signed FFC')+inp(k+'.attended','Attended FFC')+inp(k+'.hv','HV comp.')+inp(k+'.hvpct','HV %')+
  '</div></div>';
  h+=fu('ffgJuly','FFG Follow Up')+fu('churchJuly','Church Follow Up')+fu('fcyJuly','FCY Follow Up');

  h+='<div class="edit-sec"><div class="eh">Tithe / Leadership / Family Class</div><div class="fg fg4">'+
    inp('tithe.leaders','Leaders')+inp('tithe.noGiving','No record')+inp('tithe.noIncome','No income')+inp('tithe.students','Students')+
    inp('leadership.present','Leader present')+inp('leadership.absent','Absent')+inp('leadership.dz','DZ')+
    inp('familyClass.students','FC Students')+inp('familyClass.newApp','FC New app')+inp('familyClass.newBap','FC Baptism')+inp('familyClass.recruitApp','LOF Recruitment')+
  '</div></div>';

  // Apprentices - add/remove
  h+='<div class="edit-sec"><div class="eh">Apprentices</div>';
  d.apprentices.forEach((a,i)=>{
    h+='<div class="row-edit"><button class="rm" data-rm="appr" data-i="'+i+'">&times;</button><div class="fg fg2" style="padding-right:34px">'+
      '<div><label>Label</label><input type="text" data-appr="'+i+'" data-f="label" value="'+a.label+'"></div>'+
      '<div><label>Value</label><input type="number" data-appr="'+i+'" data-f="value" value="'+a.value+'"></div>'+
    '</div></div>';
  });
  h+='<button class="btn-add" data-add="appr">+ Add apprentice cohort</button></div>';

  // Path - add/remove
  h+='<div class="edit-sec"><div class="eh">Path Report (Schools)</div>';
  d.path.forEach((p,i)=>{
    h+='<div class="row-edit"><button class="rm" data-rm="path" data-i="'+i+'">&times;</button><div class="fg fg2" style="padding-right:34px">'+
      '<div><label>Name</label><input type="text" data-path2="'+i+'" data-f="name" value="'+p.name+'"></div>'+
      '<div><label>Enrolled</label><input type="number" data-path2="'+i+'" data-f="value" value="'+p.value+'"></div>'+
    '</div></div>';
  });
  h+='<button class="btn-add" data-add="path">+ Add school / program</button></div>';

  // Levels - add/remove
  h+='<div class="edit-sec"><div class="eh">LOF Levels</div>';
  d.levels.forEach((l,i)=>{
    h+='<div class="row-edit"><button class="rm" data-rm="level" data-i="'+i+'">&times;</button>'+
      '<div style="margin-bottom:10px;padding-right:34px"><label>Level name</label><input type="text" data-lvl="'+i+'" data-f="name" value="'+l.name+'"></div>'+
      '<div class="fg fg5">'+
        '<div><label>Enrolled</label><input type="number" data-lvl="'+i+'" data-f="enrolled" value="'+l.enrolled+'"></div>'+
        '<div><label>Active</label><input type="number" data-lvl="'+i+'" data-f="active" value="'+l.active+'"></div>'+
        '<div><label>Attended</label><input type="number" data-lvl="'+i+'" data-f="attended" value="'+l.attended+'"></div>'+
        '<div><label>Absent</label><input type="number" data-lvl="'+i+'" data-f="absent" value="'+l.absent+'"></div>'+
        '<div><label>DZ</label><input type="number" data-lvl="'+i+'" data-f="dz" value="'+l.dz+'"></div>'+
      '</div></div>';
  });
  h+='<button class="btn-add" data-add="level">+ Add level</button></div>';

  // Interns - add/remove people
  h+='<div class="edit-sec"><div class="eh">Interns &mdash; <input type="text" id="internMonth" value="'+d.interns.month+'" style="max-width:150px;display:inline-block"></div>';
  d.interns.people.forEach((p,pi)=>{
    h+='<div class="row-edit"><button class="rm" data-rm="intern" data-i="'+pi+'">&times;</button>'+
      '<div style="margin-bottom:10px;padding-right:34px"><label>Intern name</label><input type="text" data-int="'+pi+'" data-f="name" value="'+p.name+'"></div>';
    p.w.forEach((w,wi)=>{
      h+='<div class="fg fg4" style="margin-bottom:6px">'+
        '<div><label>W'+(wi+1)+' Recruits</label><input type="number" data-int="'+pi+'" data-w="'+wi+'" data-f="r" value="'+w.r+'"></div>'+
        '<div><label>W'+(wi+1)+' Apps</label><input type="number" data-int="'+pi+'" data-w="'+wi+'" data-f="a" value="'+w.a+'"></div>'+
        '<div><label>W'+(wi+1)+' Attend.</label><input type="text" data-int="'+pi+'" data-w="'+wi+'" data-f="f" value="'+w.f+'"></div>'+
        '<div>'+(wi===0?'<label>Total</label><input type="number" data-int="'+pi+'" data-f="tot" value="'+p.tot+'">':'')+'</div>'+
      '</div>';
    });
    h+='</div>';
  });
  h+='<button class="btn-add" data-add="intern">+ Add intern</button></div>';

  document.getElementById('editBody').innerHTML=h;
}

function collect(){
  document.querySelectorAll('[data-path]').forEach(function(el){
    const keys=el.dataset.path.split('.');
    const last=keys.pop();
    const obj=keys.reduce((o,k)=>o[k],data);
    obj[last]=el.type==='number'?(+el.value||0):el.value;
  });
  document.querySelectorAll('[data-appr]').forEach(function(el){
    const i=+el.dataset.appr,f=el.dataset.f;
    data.apprentices[i][f]=el.type==='number'?(+el.value||0):el.value;
  });
  document.querySelectorAll('[data-path2]').forEach(function(el){
    const i=+el.dataset.path2,f=el.dataset.f;
    data.path[i][f]=el.type==='number'?(+el.value||0):el.value;
  });
  document.querySelectorAll('[data-lvl]').forEach(function(el){
    const i=+el.dataset.lvl,f=el.dataset.f;
    data.levels[i][f]=el.type==='number'?(+el.value||0):el.value;
  });
  const im=document.getElementById('internMonth'); if(im) data.interns.month=im.value;
  document.querySelectorAll('[data-int]').forEach(function(el){
    const pi=+el.dataset.int,f=el.dataset.f;
    if(el.dataset.w!==undefined){ data.interns.people[pi].w[+el.dataset.w][f]=el.type==='number'?(+el.value||0):el.value; }
    else if(f==='tot'){ data.interns.people[pi].tot=+el.value||0; }
    else { data.interns.people[pi].name=el.value; }
  });
}

// Add / remove rows (collect first so we keep unsaved edits)
function addRow(kind){
  collect();
  if(kind==='appr') data.apprentices.push({label:'New cohort',value:0});
  if(kind==='path') data.path.push({name:'New program',value:0});
  if(kind==='level') data.levels.push({name:'New level',enrolled:0,active:0,attended:0,absent:0,dz:0});
  if(kind==='intern') data.interns.people.push({name:'New intern',w:[{r:0,a:0,f:''},{r:0,a:0,f:''},{r:0,a:0,f:''},{r:0,a:0,f:''}],tot:0});
  buildEditor();
}
function removeRow(kind,i){
  collect();
  if(kind==='appr') data.apprentices.splice(i,1);
  if(kind==='path') data.path.splice(i,1);
  if(kind==='level') data.levels.splice(i,1);
  if(kind==='intern') data.interns.people.splice(i,1);
  buildEditor();
}

// ---------- PIN + modal control ----------
function openPin(){
  document.getElementById('pinOverlay').classList.add('open');
  document.getElementById('pinInput').value='';
  document.getElementById('pinErr').textContent='';
  setTimeout(()=>document.getElementById('pinInput').focus(),50);
}
function closePin(){ document.getElementById('pinOverlay').classList.remove('open'); }
function tryPin(){
  const v=document.getElementById('pinInput').value;
  if(v===PIN){ closePin(); openEditor(); }
  else { document.getElementById('pinErr').textContent='Wrong PIN, try again.'; document.getElementById('pinInput').value=''; document.getElementById('pinInput').focus(); }
}
function openEditor(){ buildEditor(); document.getElementById('editOverlay').classList.add('open'); }
function closeEditor(){ document.getElementById('editOverlay').classList.remove('open'); }

document.getElementById('editBtn').onclick=openPin;
document.getElementById('pinCancel').onclick=closePin;
document.getElementById('pinOk').onclick=tryPin;
document.getElementById('pinInput').addEventListener('keydown',function(e){ if(e.key==='Enter') tryPin(); });
document.getElementById('closeBtn').onclick=closeEditor;
document.getElementById('saveBtn').onclick=function(){
  collect(); render();
  const b=document.getElementById('saveBtn');b.textContent='Saving\u2026';
  persist().then(function(){
    b.textContent='Saved \u2713';
    setTimeout(function(){ b.textContent='Save changes'; closeEditor(); },600);
  }).catch(function(){
    b.textContent='Save failed';
    setTimeout(function(){ b.textContent='Save changes'; },1500);
  });
};
// delegate add/remove clicks
document.getElementById('editBody').addEventListener('click',function(e){
  const add=e.target.closest('[data-add]');
  if(add){ addRow(add.dataset.add); return; }
  const rm=e.target.closest('[data-rm]');
  if(rm){ removeRow(rm.dataset.rm,+rm.dataset.i); return; }
});
// click outside modal closes it
document.getElementById('editOverlay').addEventListener('click',function(e){ if(e.target===this) closeEditor(); });
document.getElementById('pinOverlay').addEventListener('click',function(e){ if(e.target===this) closePin(); });

renderBanner();
render();
pullFromCloud();
startRealtime();
</script>
